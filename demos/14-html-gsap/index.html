<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Ship the motion — GSAP timeline demo</title>
<!-- Claude Motion Studio · demo 14 · one GSAP timeline driving real DOM/CSS. Open in a browser to play;
     the capture tool calls window.__seek(t) per frame instead of playing in real time. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@500;600;700&display=block" rel="stylesheet">
<style>
  :root { --ink:#071126; --sea:#0A1B41; --indigo:#1D358E; --gold:#F6D98A; --lav:#E0CAE9; --white:#FAF4EC; --coral:#F08A7E; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--ink); }
  body { font-family: Inter, sans-serif; color: var(--white); position: relative; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .75; }
  .b1 { width: 620px; height: 620px; background: var(--indigo); left: -120px; top: -160px; }
  .b2 { width: 520px; height: 520px; background: #6B4FA8; right: -140px; top: 240px; opacity: .55; }
  .b3 { width: 460px; height: 460px; background: var(--coral); left: 260px; bottom: -260px; opacity: .35; }
  .eyebrow { position: absolute; left: 90px; top: 96px; font: 600 24px Inter; letter-spacing: .2em; color: rgba(250,244,236,.6); }
  .eyebrow b { color: var(--gold); font-weight: 700; }
  h1 { position: absolute; left: 86px; top: 140px; font: 800 132px/1 Manrope; letter-spacing: -.04em; perspective: 900px; }
  h1 .line { display: block; overflow: hidden; padding-bottom: .08em; }
  h1 .ch { display: inline-block; transform-origin: 50% 100%; }
  h1 .gold { color: var(--gold); }
  .under { position: absolute; left: 90px; top: 438px; width: 520px; height: 12px; border-radius: 6px; background: var(--gold); transform-origin: left; }
  .stage { position: absolute; left: 0; top: 470px; width: 1080px; height: 420px; perspective: 1400px; }
  .card { position: absolute; top: 20px; width: 280px; height: 360px; border-radius: 34px; padding: 30px;
          background: linear-gradient(160deg, rgba(250,244,236,.16), rgba(250,244,236,.04));
          border: 1.5px solid rgba(250,244,236,.22); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
          box-shadow: 0 30px 80px rgba(3,7,18,.45); }
  .card .ic { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; font: 800 30px Manrope; color: var(--ink); }
  .card h3 { font: 800 40px Manrope; margin-top: 120px; letter-spacing: -.02em; }
  .card p { font: 500 21px Inter; color: rgba(250,244,236,.65); margin-top: 8px; }
  .c1 { left: 120px; } .c2 { left: 400px; z-index: 3; } .c3 { left: 680px; }
  .c1 .ic { background: var(--gold); } .c2 .ic { background: var(--lav); } .c3 .ic { background: var(--coral); }
  .glow { position: absolute; left: 540px; top: 200px; width: 10px; height: 10px; border-radius: 50%;
          box-shadow: 0 0 160px 90px rgba(246,217,138,.35); opacity: 0; }
  .scrub { position: absolute; left: 90px; right: 90px; top: 930px; height: 4px; border-radius: 2px; background: rgba(250,244,236,.14); }
  .scrub .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--gold); border-radius: 2px; }
  .scrub .head { position: absolute; top: -8px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--white); box-shadow: 0 0 14px rgba(246,217,138,.9); }
  .mk { position: absolute; top: 14px; font: 600 17px Inter; letter-spacing: .12em; color: rgba(250,244,236,.45); transform: translateX(-50%); }
  .mk::before { content: ""; position: absolute; left: 50%; top: -16px; width: 2px; height: 10px; background: rgba(250,244,236,.35); }
  .tag { position: absolute; bottom: 44px; font: 600 22px Inter; letter-spacing: .16em; color: rgba(250,244,236,.62); text-transform: uppercase; }
  .tag.l { left: 52px; } .tag.l b { color: var(--gold); margin-right: 14px; }
  .tag.r { right: 52px; bottom: 38px; letter-spacing: .08em; text-transform: none; font-weight: 500; padding: 6px 16px; border-radius: 999px; border: 1.5px solid rgba(250,244,236,.22); }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="eyebrow">HTML · CSS · <b>GSAP TIMELINE</b></div>
  <h1><span class="line" data-split>Ship the</span><span class="line gold" data-split>motion.</span></h1>
  <div class="under"></div>
  <div class="glow"></div>
  <div class="stage">
    <div class="card c1"><div class="ic">1</div><h3>Timeline</h3><p>labels, overlaps</p></div>
    <div class="card c2"><div class="ic">2</div><h3>Stagger</h3><p>one call, many items</p></div>
    <div class="card c3"><div class="ic">3</div><h3>Ease</h3><p>expo · back · power4</p></div>
  </div>
  <div class="scrub"><div class="fill"></div><div class="head"></div></div>
  <div class="tag l"><b>14</b>HTML + GSAP scene</div>
  <div class="tag r">GSAP · headless Chrome</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script>
  // split headline lines into characters (Latin only — never split Arabic this way)
  document.querySelectorAll("[data-split]").forEach((el) => {
    el.innerHTML = [...el.textContent].map((c) => `<span class="ch">${c === " " ? "&nbsp;" : c}</span>`).join("");
  });

  // ?gif=1 freezes the background blobs (smaller GIF previews); the video keeps them drifting
  const drift = !location.search.includes("gif");
  const tl = gsap.timeline({ paused: true, defaults: { ease: "expo.out" } });
  tl.addLabel("intro", 0)
    .to(".b1", { x: 180, y: 120, duration: drift ? 5 : 0, ease: "sine.inOut" }, 0)
    .to(".b2", { x: -160, y: -60, duration: drift ? 5 : 0, ease: "sine.inOut" }, 0)
    .to(".b3", { x: 140, y: -80, duration: drift ? 5 : 0, ease: "sine.inOut" }, 0)
    .from(".eyebrow", { y: 20, opacity: 0, duration: .8 }, .05)
    .from("h1 .line:first-child .ch", { yPercent: 115, rotateX: -80, opacity: 0, duration: 1, stagger: .03 }, .15)
    .from("h1 .line.gold .ch", { yPercent: 115, rotateX: -80, opacity: 0, duration: 1, stagger: .03 }, .45)
    .from(".under", { scaleX: 0, duration: .9, ease: "power3.inOut" }, 1.0)
    .addLabel("cards", 1.15)
    .from(".card", { z: -900, rotateY: 55, y: 160, opacity: 0, duration: 1.2, stagger: .14, ease: "power4.out" }, "cards")
    .addLabel("fan", 2.55)
    .to(".c1", { x: 150, rotation: -11, y: 26, duration: .9, ease: "back.out(1.6)" }, "fan")
    .to(".c3", { x: -150, rotation: 11, y: 26, duration: .9, ease: "back.out(1.6)" }, "fan")
    .to(".c2", { y: -24, scale: 1.08, duration: .9, ease: "back.out(1.6)" }, "fan")
    .to(".c2", { borderColor: "rgba(246,217,138,.9)", duration: .5, ease: "power2.out" }, "fan+=.3")
    .to(".glow", { opacity: 1, duration: .8, ease: "power2.out" }, "fan+=.2")
    .addLabel("outro", 3.7)
    .to(".c1", { x: 120, rotation: -14, duration: 1.3, ease: "sine.inOut" }, "outro")
    .to(".c3", { x: -120, rotation: 14, duration: 1.3, ease: "sine.inOut" }, "outro")
    .to("h1", { y: -8, duration: 1.3, ease: "sine.inOut" }, "outro")
    .set({}, {}, 5);

  // scrubber: one marker per label, playhead follows the timeline
  const scrub = document.querySelector(".scrub");
  Object.entries(tl.labels).forEach(([name, time]) => {
    const m = document.createElement("div");
    m.className = "mk"; m.textContent = name.toUpperCase();
    m.style.left = (time / tl.duration() * 100) + "%";
    scrub.appendChild(m);
  });
  const fill = scrub.querySelector(".fill"), head = scrub.querySelector(".head");
  const paint = () => { const p = tl.progress() * 100; fill.style.width = p + "%"; head.style.left = p + "%"; };

  // deterministic seek for frame capture; real-time playback otherwise
  window.__seek = (t) => { tl.seek(t, false); paint(); };
  if (!navigator.webdriver) { tl.eventCallback("onUpdate", paint); tl.play(); }
</script>
</body>
</html>
